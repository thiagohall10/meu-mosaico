<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mosaico de Lives - Final Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0b0b; color: white; margin: 0; padding: 0; }
        .header { background: #1a1a1a; padding: 15px; display: flex; gap: 10px; position: sticky; top: 0; z-index: 999; border-bottom: 2px solid #333; }
        input { flex-grow: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #000; color: #fff; }
        button { padding: 10px 20px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-add { background: #9146ff; }
        .btn-add:hover { background: #772ce8; }
        .btn-clear { background: #ff4c4c; }
        .btn-clear:hover { background: #cc3333; }
        
        #container { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 15px; padding: 15px; }
        .video-box { position: relative; background: #000; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .iframe-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Botão Fechar */
        .btn-fechar { position: absolute; top: 5px; right: 5px; z-index: 10; background: rgba(255, 0, 0, 0.85); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; }
        .btn-fechar:hover { background: #cc3333; }
        
        /* Controles inferiores de volume */
        .volume-box { background: #141414; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #222; }
        .volume-box label { font-size: 11px; color: #aaa; font-weight: bold; }
        .vol-slider { width: 60%; accent-color: #9146ff; cursor: pointer; height: 6px; }
        .btn-foco { background: #333; color: #fff; border: 1px solid #555; padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; }
        .btn-foco:hover { background: #555; }
    </style>
    <!-- API para controle de volume do YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div class="header">
    <input type="text" id="urlInput" placeholder="Cole o link aqui (YouTube, Twitch ou Kick)...">
    <button class="btn-add" onclick="adicionarLive()">ADICIONAR AO MOSAICO</button>
    <button class="btn-clear" onclick="limparTudo()">LIMPAR TUDO</button>
</div>

<div id="container"></div>

<script>
let livesSalvas = JSON.parse(localStorage.getItem('mosaico_lives')) || [];
let ytPlayers = {}; 

window.onload = function() {
    livesSalvas.forEach(url => criarElementoLive(url, false));
};

function adicionarLive() {
    const input = document.getElementById('urlInput');
    let url = input.value.trim();
    if(!url) return;

    criarElementoLive(url, true);
    input.value = "";
}

function criarElementoLive(url, salvar) {
    const container = document.getElementById('container');
    let finalUrl = "";
    let tipo = "";

    if (url.includes("youtube.com") || url.includes("youtu.be")) {
        tipo = "youtube";
        let idYt = "";
        if(url.includes("v=")) idYt = url.split("v=")[1].split("&")[0];
        else if(url.includes("live/")) idYt = url.split("live/")[1].split("?")[0];
        else idYt = url.split("/").pop();
        finalUrl = `https://www.youtube-nocookie.com/embed/${idYt}?enablejsapi=1&autoplay=1`;
    } 
    else if (url.includes("twitch.tv")) {
        tipo = "twitch";
        let canal = url.split("/").pop();
        finalUrl = "https://player.twitch.tv/?channel=" + canal + "&parent=thiagohall10.github.io&autoplay=true";
    }
    else if (url.includes("kick.com")) {
        tipo = "kick";
        let partes = url.split("kick.com/");
        if(partes.length > 1) {
            let canal = partes[1].split("/")[0].split("?")[0];
            finalUrl = `https://player.kick.com/${canal}?autoplay=true&origin=https://thiagohall10.github.io`;
        }
    }

    if (!finalUrl) return;

    if (salvar && !livesSalvas.includes(url)) {
        livesSalvas.push(url);
        localStorage.setItem('mosaico_lives', JSON.stringify(livesSalvas));
    }

    const item = document.createElement('div');
    item.className = 'video-box';
    const iframeId = 'player-' + Math.random().toString(36).substr(2, 9);

    item.innerHTML = `
        <div class="iframe-wrapper">
            <button class="btn-fechar" title="Fechar Live" onclick="removerLive('${url}', this.parentElement.parentElement)">X</button>
            <iframe id="${iframeId}" src="${finalUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
        <div class="volume-box">
            <label>VOLUME:</label>
            ${tipo === 'youtube' 
                ? `<input type="range" class="vol-slider" min="0" max="100" value="50" oninput="ajustarVolumeYT('${iframeId}', this.value)">`
                : `<button class="btn-foco" onclick="focarPlayer('${iframeId}')">🎮 Activar Teclado (Mute 'M')</button>`
            }
        </div>
    `;
    
    container.appendChild(item);

    if (tipo === "youtube") {
        setTimeout(() => {
            ytPlayers[iframeId] = new YT.Player(iframeId, {
                events: {
                    'onReady': (event) => { event.target.setVolume(50); }
                }
            });
        }, 1200);
    }
}

function focarPlayer(iframeId) {
    const el = document.getElementById(iframeId);
    if(el) {
        el.focus();
        // Clica no iframe para capturar o foco do teclado
        el.contentWindow.focus();
    }
}

function ajustarVolumeYT(id, valor) {
    if (ytPlayers[id] && typeof ytPlayers[id].setVolume === "function") {
        ytPlayers[id].setVolume(valor);
    }
}

function removerLive(url, elemento) {
    elemento.remove();
    livesSalvas = livesSalvas.filter(item => item !== url);
    localStorage.setItem('mosaico_lives', JSON.stringify(livesSalvas));
}

function limparTudo() {
    if (confirm("Deseja fechar todas as lives e limpar os favoritos?")) {
        document.getElementById('container').innerHTML = "";
        livesSalvas = [];
        ytPlayers = {};
        localStorage.removeItem('mosaico_lives');
    }
}
</script>
</body>
</html>
