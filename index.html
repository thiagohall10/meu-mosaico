<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mosaico de Lives - Som Unificado</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0b0b0b; color: white; margin: 0; padding: 0; }
        .header { background: #1a1a1a; padding: 15px; display: flex; gap: 10px; position: sticky; top: 0; z-index: 999; border-bottom: 2px solid #333; }
        input { flex-grow: 1; padding: 12px; border-radius: 5px; border: 1px solid #444; background: #000; color: #fff; }
        button { padding: 10px 20px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-add { background: #9146ff; }
        .btn-add:hover { background: #772ce8; }
        .btn-clear { background: #ff4c4c; }
        .btn-clear:hover { background: #cc3333; }
        
        #container { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 15px; padding: 15px; }
        .video-box { position: relative; background: #000; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #222; }
        .iframe-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; }
        iframe { width: 100%; height: 100%; border: none; }
        .btn-fechar { position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.8); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; z-index: 10; font-weight: bold; }
        
        /* Barra de volume roxa unificada */
        .volume-box { background: #141414; padding: 12px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #222; }
        .volume-box label { font-size: 11px; color: #aaa; font-weight: bold; letter-spacing: 1px; }
        .vol-slider { flex-grow: 1; accent-color: #9146ff; cursor: pointer; height: 6px; }
    </style>
</head>
<body>

<div class="header">
    <input type="text" id="urlInput" placeholder="Cole o link aqui (YouTube, Twitch ou Kick)...">
    <button class="btn-add" onclick="adicionarLive()">ADICIONAR AO MOSAICO</button>
    <button class="btn-clear" onclick="limparTudo()">LIMPAR TUDO</button>
</div>

<div id="container"></div>

<script>
let livesSalvas = JSON.parse(localStorage.getItem('mosaico_lives')) || [];

window.onload = function() {
    livesSalvas.forEach(url => criarElementoLive(url, false));
};

function adicionarLive() {
    const input = document.getElementById('urlInput');
    let url = input.value.trim();
    if(!url) return;

    criarElementoLive(url, true);
    input.value = "";
}

function criarElementoLive(url, salvar) {
    const container = document.getElementById('container');
    let finalUrl = "";

    if (url.includes("youtube.com") || url.includes("youtu.be")) {
        let idYt = "";
        if(url.includes("v=")) idYt = url.split("v=")[1].split("&")[0];
        else if(url.includes("live/")) idYt = url.split("live/")[1].split("?")[0];
        else idYt = url.split("/").pop();
        finalUrl = `https://www.youtube-nocookie.com/embed/${idYt}?autoplay=1`;
    } 
    else if (url.includes("twitch.tv")) {
        let canal = url.split("/").pop();
        finalUrl = "https://player.twitch.tv/?channel=" + canal + "&parent=thiagohall10.github.io&autoplay=true";
    }
    else if (url.includes("kick.com")) {
        let partes = url.split("kick.com/");
        if(partes.length > 1) {
            let canal = partes[1].split("/")[0].split("?")[0];
            finalUrl = `https://player.kick.com/${canal}?autoplay=true`;
        }
    }

    if (!finalUrl) return;

    if (salvar && !livesSalvas.includes(url)) {
        livesSalvas.push(url);
        localStorage.setItem('mosaico_lives', JSON.stringify(livesSalvas));
    }

    const item = document.createElement('div');
    item.className = 'video-box';
    const iframeId = 'player-' + Math.random().toString(36).substr(2, 9);

    item.innerHTML = `
        <div class="iframe-wrapper">
            <button class="btn-fechar" onclick="removerLive('${url}', this.parentElement.parentElement)">X</button>
            <iframe id="${iframeId}" src="${finalUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
        <div class="volume-box">
            <label>VOLUME:</label>
            <input type="range" class="vol-slider" min="0" max="100" value="50" oninput="mudarVolumeFrame('${iframeId}', this.value)">
        </div>
    `;
    
    container.appendChild(item);
}

// SOLUÇÃO DEFINITIVA: Altera o ganho diretamente no elemento de janela do iframe
function mudarVolumeFrame(id, valor) {
    try {
        const frame = document.getElementById(id);
        if (frame) {
            // Converte de 0-100 para a escala decimal de 0.0 a 1.0 do navegador
            const volumeDecimal = valor / 100;
            
            // Força a alteração de volume diretamente na janela de renderização do iframe
            if(frame.contentWindow) {
                frame.contentWindow.postMessage(JSON.stringify({
                    event: 'command',
                    func: 'setVolume',
                    args: [valor]
                }), '*'); // Comando padrão para YouTube
                
                // Força o controle direto sobre tags de áudio/vídeo internas se houver permissão de domínios
                const elementosAudio = frame.contentWindow.document.querySelectorAll('video, audio');
                elementosAudio.forEach(midia => midia.volume = volumeDecimal);
            }
        }
    } catch (e) {
        // Caso o navegador bloqueie a leitura interna por segurança cross-origin (CORS),
        // ele tenta usar o método alternativo de postMessage genérico para os players.
        const frame = document.getElementById(id);
        const volumeDecimal = valor / 100;
        frame.contentWindow.postMessage({ 'externalMouseEvent': 'volume', 'value': volumeDecimal }, '*');
    }
}

function removerLive(url, elemento) {
    elemento.remove();
    livesSalvas = livesSalvas.filter(item => item !== url);
    localStorage.setItem('mosaico_lives', JSON.stringify(livesSalvas));
}

function limparTudo() {
    if (confirm("Deseja fechar todas as lives e limpar os favoritos?")) {
        document.getElementById('container').innerHTML = "";
        livesSalvas = [];
        localStorage.removeItem('mosaico_lives');
    }
}
</script>
</body>
</html>
